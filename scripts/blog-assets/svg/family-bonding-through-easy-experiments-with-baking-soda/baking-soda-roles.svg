<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect x="0" y="0" width="1080" height="1080" rx="0" fill="#fffaf0"/><text x="54" y="60" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#c76851">KIDTIVITY LAB</text><text x="54" y="133" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#29463e">A role for every scientist</text><text x="54" y="184" font-family="Arial, sans-serif" font-size="26" font-weight="500" fill="#5b7067">Swap jobs after each experiment. An adult stays in charge.</text><text x="54" y="1050" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#5b7067">kidtivitylab.com  /  Play. Notice. Try again.</text><rect x="55" y="240" width="475" height="325" rx="22" fill="#f6e7ca"/><g transform="translate(120,310) scale(0.75)"><path d="M-34-32H34L26 38H-26Z" fill="#dfeada" stroke="#29463e" stroke-width="3"/><path d="M-27 1L28 1" stroke="#80aeb3" stroke-width="5" stroke-linecap="round" fill="none"/></g><text x="185" y="320" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#29463e">Measurer</text><text x="85" y="408" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">Gets the supplies ready.</text><text x="85" y="515" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#29463e">My name: ______________</text><rect x="550" y="240" width="475" height="325" rx="22" fill="#dfeada"/><g transform="translate(615,310) scale(0.75)"><path d="M0-46C-16-19-36 0-33 20C-29 58 29 58 33 20C36 0 16-19 0-46Z" fill="#b8d9db" stroke="#29463e" stroke-width="3"/><path d="M-18 16L-12 27" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/></g><text x="680" y="320" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#29463e">Pourer</text><text x="580" y="408" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">Adds the ingredient</text><text x="580" y="447" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">slowly.</text><text x="580" y="515" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#29463e">My name: ______________</text><rect x="55" y="595" width="475" height="325" rx="22" fill="#f6e7ca"/><g transform="translate(120,665) scale(0.75)"><circle cx="-8" cy="-10" r="28" fill="#e0edef" stroke="#29463e" stroke-width="5"/><path d="M13 13L39 42" stroke="#c76851" stroke-width="12" stroke-linecap="round" fill="none"/></g><text x="185" y="675" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#29463e">Predictor</text><text x="85" y="763" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">Says what might happen.</text><text x="85" y="870" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#29463e">My name: ______________</text><rect x="550" y="595" width="475" height="325" rx="22" fill="#dfeada"/><g transform="translate(615,665) scale(0.75)"><path d="M-30 25L18-34L35-20L-13 39L-38 45Z" fill="#edc77e" stroke="#29463e" stroke-width="3"/><path d="M17 -32L33 -19" stroke="#29463e" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M-37 44l5-16l14 12z" fill="#c76851"/></g><text x="680" y="675" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#29463e">Recorder</text><text x="580" y="763" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">Draws or writes the</text><text x="580" y="802" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">result.</text><text x="580" y="870" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#29463e">My name: ______________</text></svg>