>Vinegar in bottle</text><text x="770" y="664" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#29463e">Carbon dioxide fills balloon</text><rect x="54" y="690" width="1092" height="50" rx="10" fill="#dfeada"/><text x="72" y="722" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#29463e">Never add a rigid cap. Small amounts only; adult handles balloon and scraps.</text></svg>