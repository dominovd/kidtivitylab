<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#fffaf0"/><text x="60" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c76851">KIDTIVITY LAB</text><text x="60" y="140" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#29463e">Small skills, growing independence</text><text x="60" y="210" font-family="Arial, sans-serif" font-size="26" font-weight="500" fill="#29463e">Examples, not a diagnostic test</text><text x="60" y="1308" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#29463e">kidtivitylab.com  /  Small steps. Everyday practice.</text><rect x="55" y="260" width="300" height="895" rx="24" fill="#dfeada"/><text x="83" y="330" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#29463e">AGE 3</text><circle cx="95" cy="400" r="16" fill="#c76851"/><text x="80" y="450" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">Pulls on loose</text><text x="80" y="487.8" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">clothing</text><circle cx="95" cy="565" r="16" fill="#c76851"/><text x="80" y="615" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">Uses a fork</text><circle cx="95" cy="730" r="16" fill="#c76851"/><text x="80" y="780" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">Joins other</text><text x="80" y="817.8" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">children's play</text><circle cx="95" cy="895" r="16" fill="#c76851"/><text x="80" y="945" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">Avoids heat after</text><text x="80" y="982.8" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">a warning</text><rect x="380" y="260" width="300" height="895" rx="24" fill="#f7e8cc"/><text x="408" y="330" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#29463e">AGE 4</text><circle cx="420" cy="400" r="16" fill="#c76851"/><text x="405" y="450" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">Opens some buttons</text><circle cx="420" cy="565" r="16" fill="#c76851"/><text x="405" y="615" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">Pours with adult</text><text x="405" y="652.8" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">supervision</text><circle cx="420" cy="730" r="16" fill="#c76851"/><text x="405" y="780" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">Likes being a</text><text x="405" y="817.8" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">helper</text><circle cx="420" cy="895" r="16" fill="#c76851"/><text x="405" y="945" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">Asks to play with</text><text x="405" y="982.8" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">others</text><rect x="705" y="260" width="300" height="895" rx="24" fill="#dfeada"/><text x="733" y="330" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#29463e">AGE 5</text><circle cx="745" cy="400" r="16" fill="#c76851"/><text x="730" y="450" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">Closes some</text><text x="730" y="487.8" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">buttons</text><circle cx="745" cy="565" r="16" fill="#c76851"/><text x="730" y="615" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">Matches socks or</text><text x="730" y="652.8" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">clears table</text><circle cx="745" cy="730" r="16" fill="#c76851"/><text x="730" y="780" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">Takes turns in</text><text x="730" y="817.8" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">games</text><circle cx="745" cy="895" r="16" fill="#c76851"/><text x="730" y="945" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">Focuses for 5-10</text><text x="730" y="982.8" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#29463e">minutes</text><text x="60" y="1200" font-family="Arial, sans-serif" font-size="25" font-weight="500" fill="#29463e">Source: CDC milestones, ages 3, 4, and 5.</text><text x="60" y="1240" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#29463e">Discuss missed milestones or concerns with your pediatrician.</text></svg>