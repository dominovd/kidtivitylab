<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#fffaf0"/><text x="60" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c76851">KIDTIVITY LAB</text><text x="60" y="140" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#29463e">Build from the last jacket step</text><text x="60" y="210" font-family="Arial, sans-serif" font-size="26" font-weight="500" fill="#29463e">Adult connects the zipper first; hand over more as the child is ready.</text><text x="60" y="758" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#29463e">kidtivitylab.com  /  Small steps. Everyday practice.</text><rect x="45" y="265" width="270" height="425" rx="24" fill="#f7e8cc"/><path d="M125 320 l40 -20 h30 l40 20 35 70 -35 20 -20 -40 v135 h-110 v-135 l-20 40 -35 -20z" fill="#c76851"/><path d="M180 310v185" stroke="#fffaf0" stroke-width="8"/><circle cx="180" cy="478" r="10" fill="#eec77b"/><text x="63" y="554" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#29463e">Adult helps</text><text x="63" y="600" font-family="Arial, sans-serif" font-size="25" font-weight="500" fill="#29463e">Arms in. Zipper</text><text x="63" y="633.75" font-family="Arial, sans-serif" font-size="25" font-weight="500" fill="#29463e">connected.</text><rect x="335" y="265" width="270" height="425" rx="24" fill="#dfeada"/><path d="M415 320 l40 -20 h30 l40 20 35 70 -35 20 -20 -40 v135 h-110 v-135 l-20 40 -35 -20z" fill="#c76851"/><path d="M470 310v185" stroke="#fffaf0" stroke-width="8"/><circle cx="470" cy="340" r="10" fill="#eec77b"/><text x="353" y="554" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#29463e">Child finishes</text><text x="353" y="600" font-family="Arial, sans-serif" font-size="25" font-weight="500" fill="#29463e">Pull the zipper up.</text><rect x="625" y="265" width="270" height="425" rx="24" fill=