<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#fffaf0"/><text x="60" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c76851">KIDTIVITY LAB</text><text x="60" y="140" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#29463e">Practice spotting a request for secrecy</text><text x="60" y="210" font-family="Arial, sans-serif" font-size="26" font-weight="500" fill="#29463e">Pretend messages. No real accounts or conversations.</text><text x="60" y="758" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#29463e">kidtivitylab.com  /  Small steps. Everyday practice.</text><rect x="70" y="270" width="1060" height="155" rx="24" fill="#dfeada"/><text x="105" y="325" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#29463e">GAME TALK</text><text x="105" y="380" font-family="Arial, sans-serif" font-size="34" font-weight="500" fill="#29463e">Want to build a bridge in the game?</text><rect x="70" y="465" width="1060" height="170" rx="24" fill="#f8e0d5"/><text x="105" y="520" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c76851">STOP AND TELL AN ADULT</text><text x="105" y="580" font-family="Arial, sans-serif" font-size="34" font-weight="500" fill="#29463e">Keep chatting, but don't tell your parents.</text><text x="70" y="705" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#29463e">You do not need to reply or prove that someone is unsafe.</text></svg>