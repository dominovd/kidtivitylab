<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#fffaf0"/><text x="60" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c76851">KIDTIVITY LAB</text><text x="60" y="140" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#29463e">Stop and get a trusted adult</text><text x="60" y="210" font-family="Arial, sans-serif" font-size="26" font-weight="500" fill="#29463e">You can leave a chat even if you are not sure.</text><text x="60" y="1308" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#29463e">kidtivitylab.com  /  Small steps. Everyday practice.</text><rect x="55" y="260" width="475" height="215" rx="24" fill="#f7e8cc"/><path d="M93 288h30l20 20v30l-20 20h-30l-20-20v-30z" fill="#c76851"/><text x="100" y="338" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#fffaf0">!</text><text x="80" y="405" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#29463e">Lots of personal</text><text x="80" y="444.15" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#29463e">questions</text><rect x="550" y="260" width="475" height="215" rx="24" fill="#dfeada"/><path d="M588 288h30l20 20v30l-20 20h-30l-20-20v-30z" fill="#c76851"/><text x="595" y="338" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#fffaf0">!</text><text x="575" y="405" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#29463e">Keep our friendship</text><text x="575" y="444.15" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#29463e">secret</text><rect x="55" y="495" width="475" height="215" rx="24" fill="#f7e8cc"/><path d="M93 523h30l20 20v30l-20 20h-30l-20-20v-30z" fill="#c76851"/><text x="100" y="573" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#fffaf0">!</text><text x="80" y="640" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#29463e">Move to another app</text><rect x="550" y="495" width="475" height="215" rx="24" fill="#dfeada"/><path d="M588 523h30l20 20v30l-20 20h-30l-20-20v-30z" fill="#c76851"/><text x="595" y="573" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#fffaf0">!</text><text x="575" y="640" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#29463e">Who is home? Which room?</text><rect x="55" y="730" width="475" height="215" rx="24" fill="#f7e8cc"/><path d="M93 758h30l20 20v30l-20 20h-30l-20-20v-30z" fill="#c76851"/><text x="100" y="808" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#fffaf0">!</text><text x="80" y="875" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#29463e">Comments about your body</text><rect x="550" y="730" width="475" height="215" rx="24" fill="#dfeada"/><path d="M588 758h30l20 20v30l-20 20h-30l-20-20v-30z" fill="#c76851"/><text x="595" y="808" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#fffaf0">!</text><text x="575" y="875" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#29463e">Send a photo or video</text><rect x="55" y="965" width="475" height="215" rx="24" fill="#f7e8cc"/><path d="M93 993h30l20 20v30l-20 20h-30l-20-20v-30z" fill="#c76851"/><text x="100" y="1043" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#fffaf0">!</text><text x="80" y="1110" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#29463e">Gifts with strings</text><text x="80" y="1149.15" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#29463e">attached</text><rect x="550" y="965" width="475" height="215" rx="24" fill="#dfeada"/><path d="M588 993h30l20 20v30l-20 20h-30l-20-20v-30z" fill="#c76851"/><text x="595" y="1043" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#fffaf0">!</text><text x="