<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#fffaf0"/><text x="60" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c76851">KIDTIVITY LAB</text><text x="60" y="140" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#29463e">Skip the label. Notice what helps.</text><text x="60" y="1308" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#29463e">kidtivitylab.com  /  Small steps. Everyday practice.</text><text x="70" y="240" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#c76851">MYTH</text><text x="555" y="240" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#29463e">WHAT HELPS</text><rect x="55" y="280" width="470" height="205" rx="24" fill="#f7e8cc"/><rect x="545" y="280" width="480" height="205" rx="24" fill="#dfeada"/><text x="80" y="338" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">Only pictures work for</text><text x="80" y="378.5" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">me.</text><text x="570" y="338" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">Use pictures when they</text><text x="570" y="378.5" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">clarify the idea.</text><rect x="55" y="515" width="470" height="205" rx="24" fill="#f7e8cc"/><rect x="545" y="515" width="480" height="205" rx="24" fill="#dfeada"/><text x="80" y="573" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">Liking it means</text><text x="80" y="613.5" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">learning it.</text><text x="570" y="573" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">Check what is remembered</text><text x="570" y="613.5" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">later.</text><rect x="55" y="750" width="470" height="205" rx="24" fill="#f7e8cc"/><rect x="545" y="750" width="480" height="205" rx="24" fill="#dfeada"/><text x="80" y="808" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">More drills today are</text><text x="80" y="848.5" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">best.</text><text x="570" y="808" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">Return to practice on</text><text x="570" y="848.5" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">another day.</text><rect x="55" y="985" width="470" height="205" rx="24" fill="#f7e8cc"/><rect x="545" y="985" width="480" height="205" rx="24" fill="#dfeada"/><text x="80" y="1043" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">A slow answer means</text><text x="80" y="1083.5" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">less ability.</text><text x="570" y="1043" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">Allow time and check</text><text x="570" y="1083.5" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#29463e">understanding.</text></svg>