<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#fffaf0"/><text x="60" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c76851">KIDTIVITY LAB</text><text x="60" y="140" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#29463e">Five steps to a savings goal</text><text x="60" y="210" font-family="Arial, sans-serif" font-size="26" font-weight="500" fill="#29463e">Small amounts. A visible plan. Weekly practice.</text><text x="60" y="1308" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#29463e">kidtivitylab.com  /  Small steps. Everyday practice.</text><rect x="60" y="270" width="960" height="155" rx="24" fill="#dfeada"/><circle cx="135" cy="348" r="42" fill="#c76851"/><text x="121" y="363" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#fffaf0">1</text><text x="215" y="338" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#29463e">Pick one affordable goal</text><rect x="60" y="455" width="960" height="155" rx="24" fill="#f7e8cc"/><circle cx="135" cy="533" r="42" fill="#c76851"/><text x="121" y="548" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#fffaf0">2</text><text x="215" y="523" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#29463e">Make the goal and progress visible</text><rect x="60" y="640" width="960" height="155" rx="24" fill="#dfeada"/><circle cx="135" cy="718" r="42" fill="#c76851"/><text x="121" y="733" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#fffaf0">3</text><text x="215" y="708" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#29463e">Agree where the money comes from</text><rect x="60" y="825" width="960" height="155" rx="24" fill="#f7e8cc"/><circle cx="135" cy="903" r="42" fill="#c76851"/><text x="121" y="918" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#fffaf0">4</text><text x="215" y="893" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#29463e">Count together each week</text><rect x="60" y="1010" width="960" height="155" rx="24" fill="#dfeada"/><circle cx="135" cy="1088" r="42" fill="#c76851"/><text x="121" y="1103" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#fffaf0">5</text><text x="215" y="1078" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#29463e">Buy it, then talk about it</text></svg>