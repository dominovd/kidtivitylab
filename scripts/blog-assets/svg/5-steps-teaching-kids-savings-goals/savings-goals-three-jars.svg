<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect x="0" y="0" width="1080" height="1080" rx="0" fill="#fffaf0"/><text x="60" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c76851">KIDTIVITY LAB</text><text x="60" y="140" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#29463e">Three jars, three choices</text><text x="60" y="210" font-family="Arial, sans-serif" font-size="26" font-weight="500" fill="#29463e">Choose amounts that fit your family.</text><text x="60" y="1038" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#29463e">kidtivitylab.com  /  Small steps. Everyday practice.</text><rect x="80" y="350" width="245" height="360" rx="40" fill="#f7e8cc" stroke="#29463e" stroke-width="4"/><rect x="102" y="325" width="200" height="35" rx="9" fill="#c76851"/><ellipse cx="140" cy="660" rx="27" ry="17" fill="#eec77b" stroke="#29463e" stroke-width="2"/><ellipse cx="195" cy="660" rx="27" ry="17" fill="#eec77b" stroke="#29463e" stroke-width="2"/><ellipse cx="250" cy="660" rx="27" ry="17" fill="#eec77b" stroke="#29463e" stroke-width="2"/><text x="115" y="465" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#29463e">SPEND</text><rect x="420" y="350" width="245" height="360" rx="40" fill="#dfeada" stroke="#29463e" stroke-width="4"/><rect x="442" y="325" width="200" height="35" rx="9" fill="#c76851"/><ellipse cx="480" cy="660" rx="27" ry="17" fill="#eec77b" stroke="#29463e" stroke-width="2"/><ellipse cx="535" cy="660" rx="27" ry="17" fill="#eec77b" stroke="#29463e" stroke-width="2"/><ellipse cx="590" cy="660" rx="27" ry="17" fill="#eec77b" stroke="#29463e" stroke-width="2"/><ellipse cx="480" cy="610" rx="27" ry="17" fill="#eec77b" stroke="#29463e" stroke-width="2"/><text x="455" y="465" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#29463e">SAVE</text><rect x="760" y="350" width="245" height="360" rx="40" fill="#f7e8cc" stroke="#29463e" stroke-width="4"/><rect x="782" y="325" width="200" height="35" rx="9" fill="#c76851"/><ellipse cx="820" cy="660" rx="27" ry="17" fill="#eec77b" stroke="#29463e" stroke-width="2"/><ellipse cx="875" cy="660" rx="27" ry="17" fill="#eec77b" stroke="#29463e" stroke-width="2"/><ellipse cx="930" cy="660" rx="27" ry="17" fill="#eec77b" stroke="#29463e" stroke-width="2"/><ellipse cx="820" cy="610" rx="27" ry="17" fill="#eec77b" stroke="#29463e" stroke-width="2"/><ellipse cx="875" cy="610" rx="27" ry="17" fill="#eec77b" stroke="#29463e" stroke-width="2"/><text x="795" y="465" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#29463e">SHARE</text><text x="75" y="820" font-family="Arial, sans-serif" font-size="34" font-weight="500" fill="#29463e">A single savings jar is enough to start.</text><text x="75" y="865.9" font-family="Arial, sans-serif" font-size="34" font-weight="500" fill="#29463e">More jars are optional.</text><text x="75" y="963" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#29463e">Keep coins away from under-3s and children who mouth objects.</text></svg>