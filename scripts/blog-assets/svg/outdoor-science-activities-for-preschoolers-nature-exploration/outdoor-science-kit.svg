<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect x="0" y="0" width="1080" height="1080" rx="0" fill="#fffaf0"/><text x="54" y="60" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#c76851">KIDTIVITY LAB</text><text x="54" y="133" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#29463e">Pack a small nature kit</text><text x="54" y="184" font-family="Arial, sans-serif" font-size="26" font-weight="500" fill="#5b7067">Bring a question, too: "What do you notice?"</text><text x="54" y="1050" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#5b7067">kidtivitylab.com  /  Play. Notice. Try again.</text><rect x="55" y="235" width="475" height="210" rx="22" fill="#f6e7ca"/><g transform="translate(120,300) scale(0.68)"><circle cx="-8" cy="-10" r="28" fill="#e0edef" stroke="#29463e" stroke-width="5"/><path d="M13 13L39 42" stroke="#c76851" stroke-width="12" stroke-linecap="round" fill="none"/></g><text x="180" y="295" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#29463e">Magnifier</text><text x="80" y="380" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#29463e">Look closely.</text><rect x="550" y="235" width="475" height="210" rx="22" fill="#dfeada"/><g transform="translate(615,300) scale(0.68)"><path d="M-35 24L17-34L34-19L-18 39Z" fill="#c76851"/><path d="M-30 38L36 38" stroke="#c76851" stroke-width="4" stroke-linecap="round" fill="none"/></g><text x="675" y="295" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#29463e">Sidewalk chalk</text><text x="575" y="380" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#29463e">Trace a shadow.</text><rect x="55" y="470" width="475" height="210" rx="22" fill="#f6e7ca"/><g transform="translate(120,535) scale(0.68)"><rect x="-32" y="-28" width="64" height="70" rx="12" fill="#e0edef"/><rect x="-29" y="-39" width="58" height="14" rx="4" fill="#c76851"/><path d="M-22 19Q0 2 22 19V30H-22Z" fill="#dfeada"/></g><text x="180" y="530" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#29463e">Ventilated jar</text><text x="80" y="615" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#29463e">Brief adult-led viewing.</text><rect x="550" y="470" width="475" height="210" rx="22" fill="#dfeada"/><g transform="translate(615,535) scale(0.68)"><path d="M-30 25L18-34L35-20L-13 39L-38 45Z" fill="#edc77e" stroke="#29463e" stroke-width="3"/><path d="M17 -32L33 -19" stroke="#29463e" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M-37 44l5-16l14 12z" fill="#c76851"/></g><text x="675" y="530" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#29463e">Paper + crayons</text><text x="575" y="615" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#29463e">Draw what you find.</text><rect x="55" y="705" width="475" height="210" rx="22" fill="#f6e7ca"/><g transform="translate(120,770) scale(0.68)"><path d="M-28 30Q-48-31 32-39Q49 23-28 30Z" fill="#dfeada" stroke="#29463e" stroke-width="3"/><path d="M-28 30L20 -24" stroke="#29463e" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M-5 4L-20 -13" stroke="#29463e" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M3 -5L22 0" stroke="#29463e" stroke-width="4" stroke-linecap="round" fill="none"/></g><text x="180" y="765" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#29463e">Collecting bag</text><text x="80" y="850" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#29463e">Fallen, safe finds only.</text><text x="555" y="785" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#29463e">Watch bugs without</text><text x="555" y="820.1" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#29463e">touching. Leave living</text><text x="555" y="855.2" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#29463e">things where you found</text><text x="555" y="890.3000000000001" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#29463e">them.</text><text x="55" y="1000" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#29463e">Keep jars open or ventilated; return any observed animal promptly.</text></svg>