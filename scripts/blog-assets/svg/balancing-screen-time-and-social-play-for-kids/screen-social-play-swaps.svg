<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#fffaf0"/><text x="55" y="65" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#c76851">KIDTIVITY LAB</text><text x="55" y="135" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#29463e">Eight moments. Easy games to try.</text><text x="55" y="192" font-family="Arial,sans-serif" font-size="26" font-weight="500" fill="#29463e">Offer a first action, not just "Go play."</text><text x="55" y="1315" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#c76851">kidtivitylab.com</text><rect x="55" y="245" width="475" height="231" rx="22" fill="#dfeada"/><text x="78" y="285" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#c76851">Rainy afternoon</text><text x="78" y="332" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#29463e">Freeze Dance</text><text x="78" y="405" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">Clear space. Take turns</text><text x="78" y="437.5" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">choosing poses.</text><rect x="550" y="245" width="475" height="231" rx="22" fill="#f7e8cc"/><text x="573" y="285" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#c76851">Friends arrive</text><text x="573" y="332" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#29463e">Pass the Parcel</text><text x="573" y="405" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">Try shared silly prompts.</text><rect x="55" y="498" width="475" height="231" rx="22" fill="#dfeada"/><text x="78" y="538" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#c76851">After preschool</text><text x="78" y="585" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#29463e">Follow the Leader</text><text x="78" y="658" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">Let a tired child lead</text><text x="78" y="690.5" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">gently.</text><rect x="550" y="498" width="475" height="231" rx="22" fill="#f7e8cc"/><text x="573" y="538" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#c76851">Dinner preparation</text><text x="573" y="585" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#29463e">Story Chain</text><text x="573" y="658" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">Add a sentence from a safe</text><text x="573" y="690.5" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">spot.</text><rect x="55" y="751" width="475" height="231" rx="22" fill="#dfeada"/><text x="78" y="791" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#c76851">Siblings together</text><text x="78" y="838" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#29463e">Shadow Puppet Theater</text><text x="78" y="911" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">One makes shapes; one</text><text x="78" y="943.5" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">narrates.</text><rect x="550" y="751" width="475" height="231" rx="22" fill="#f7e8cc"/><text x="573" y="791" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#c76851">Long drive</text><text x="573" y="838" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#29463e">A traveling story</text><text x="573" y="911" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">Stay buckled. Let the driver</text><text x="573" y="943.5" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">focus.</text><rect x="55" y="1004" width="475" height="231" rx="22" fill="#dfeada"/><text x="78" y="1044" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#c76851">Waiting room</text><text x="78" y="1091" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#29463e">Quiet hand-animal</text><text x="78" y="1130" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#29463e">guessing</text><text x="78" y="1164" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">Small shapes. Quiet voices.</text><rect x="550" y="1004" width="475" height="231" rx="22" fill="#f7e8cc"/><text x="573" y="1044" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#c76851">Before bed</text><text x="573" y="1091" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#29463e">Blanket-fort reading</text><text x="573" y="1164" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">Read together, then use your</text><text x="573" y="1196.5" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">usual bed.</text></svg>