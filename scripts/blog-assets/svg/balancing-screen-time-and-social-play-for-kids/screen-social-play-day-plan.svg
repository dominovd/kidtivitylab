<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#fffaf0"/><text x="55" y="65" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#c76851">KIDTIVITY LAB</text><text x="55" y="135" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#29463e">Plan the day first. Fit screens around it.</text><text x="55" y="192" font-family="Arial,sans-serif" font-size="26" font-weight="500" fill="#29463e">A planning order, not a clock-based schedule or recommended quota.</text><text x="55" y="765" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#c76851">kidtivitylab.com</text><rect x="55" y="240" width="520" height="130" rx="22" fill="#dfeada"/><text x="80" y="285" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#29463e">SLEEP + DAILY ROUTINES</text><text x="80" y="330" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">Bedtime, school, and getting ready</text><rect x="605" y="240" width="520" height="130" rx="22" fill="#f7e8cc"/><text x="630" y="285" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#29463e">MEALS TOGETHER</text><text x="630" y="330" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">Choose a meal with devices away</text><rect x="55" y="395" width="520" height="130" rx="22" fill="#dfeada"/><text x="80" y="440" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#29463e">MOVEMENT</text><text x="80" y="485" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">Outdoor play or active indoor play</text><rect x="605" y="395" width="520" height="130" rx="22" fill="#f7e8cc"/><text x="630" y="440" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#29463e">PLAY WITH OTHERS</text><text x="630" y="485" font-family="Arial,sans-serif" font-size="25" font-weight="500" fill="#29463e">A friend, sibling, or caregiver</text><rect x="55" y="575" width="1070" height="145" rx="22" fill="#f5ddd3"/><text x="80" y="625" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#29463e">THEN: A PLANNED SCREEN WINDOW</text><text x="80" y="677" font-family="Arial,sans-serif" font-size="29" font-weight="500" fill="#29463e">Choose the content, company, and ending before you start.</text></svg>