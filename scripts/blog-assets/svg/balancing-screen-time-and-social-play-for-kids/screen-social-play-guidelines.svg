<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#fffaf0"/><text x="55" y="65" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#c76851">KIDTIVITY LAB</text><text x="55" y="135" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#29463e">Screen guidance, with context</text><text x="55" y="192" font-family="Arial,sans-serif" font-size="26" font-weight="500" fill="#29463e">Quality, company, and what screens replace all matter.</text><text x="55" y="1315" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#c76851">kidtivitylab.com</text><text x="70" y="260" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#29463e">AGE</text><text x="235" y="260" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#29463e">WHO (2019)</text><text x="640" y="260" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#29463e">AAP (2026)</text><rect x="55" y="285" width="970" height="198" rx="22" fill="#dfeada"/><text x="75" y="338" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#29463e">Under 2</text><text x="235" y="335" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">Not recommended under 1</text><text x="235" y="371.4" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">or at age 1.</text><text x="640" y="335" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">Prioritize real-world</text><text x="640" y="371.4" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">interaction,</text><text x="640" y="407.79999999999995" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">especially in infancy.</text><rect x="55" y="503" width="970" height="198" rx="22" fill="#f7e8cc"/><text x="75" y="556" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#29463e">2</text><text x="235" y="553" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">No more than 1 hour</text><text x="235" y="589.4" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">daily. Less is better.</text><text x="640" y="553" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">Tailor boundaries.</text><text x="640" y="589.4" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">Under 1 hour is its</text><text x="640" y="625.8" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">toddler/preschool</text><text x="640" y="662.1999999999999" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">example.</text><rect x="55" y="721" width="970" height="198" rx="22" fill="#dfeada"/><text x="75" y="774" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#29463e">3-4</text><text x="235" y="771" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">No more than 1 hour</text><text x="235" y="807.4" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">daily. Less is better.</text><text x="640" y="771" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">Consider content,</text><text x="640" y="807.4" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">co-use, and what gets</text><text x="640" y="843.8" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">crowded out.</text><rect x="55" y="939" width="970" height="198" rx="22" fill="#f7e8cc"/><text x="75" y="992" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#29463e">5-10</text><text x="235" y="989" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">Not covered by this</text><text x="235" y="1025.4" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">under-5 guideline.</text><text x="640" y="989" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">Tailor recreational</text><text x="640" y="1025.4" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">limits. School-age</text><text x="640" y="1061.8000000000002" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">examples: 1-2 hours or</text><text x="640" y="1098.2000000000003" font-family="Arial,sans-serif" font-size="28" font-weight="500" fill="#29463e">more.</text><text x="55" y="1193" font-family="Arial,sans-serif" font-size="24" font-weight="500" fill="#29463e">WHO refers to sedentary screen time. AAP examples are flexible.</text><text x="55" y="1231" font-family="Arial,sans-serif" font-size="24" font-weight="500" fill="#29463e">Protect sleep, movement, reading, play, and family time first.</text><text x="55" y="1272" font-family="Arial,sans-serif" font-size="21" font-weight="500" fill="#29463e">Sources: who.int (under-5 guidance); AAP, doi:10.1542/peds.2025-075320</text></svg>