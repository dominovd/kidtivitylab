<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"><rect x="0" y="0" width="1200" height="800" rx="0" fill="#fffaf0"/><text x="54" y="60" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#c76851">KIDTIVITY LAB</text><text x="54" y="133" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#29463e">Predict first: will it float?</text><text x="54" y="184" font-family="Arial, sans-serif" font-size="26" font-weight="500" fill="#5b7067">Test each object gently. Its material, shape, and trapped air matter.</text><text x="54" y="770" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#5b7067">kidtivitylab.com  /  Play. Notice. Try again.</text><rect x="65" y="230" width="1070" height="440" rx="22" fill="#e4eff0"/><path d="M145 335Q600 300 1055 335L980 610H220Z" fill="#b8d9db" stroke="#29463e" stroke-width="4"/><path d="M150 355L1050 355" stroke="#6f9ca4" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="330" cy="345" r="48" fill="#c76851"/><path d="M330 297q5-28 30-28" stroke="#29463e" fill="none" stroke-width="5"/><rect x="455" y="320" width="95" height="55" rx="8" fill="#edc77e"/><ellipse cx="690" cy="550" rx="47" ry="20" fill="#8b9a9a"/><path d="M730 550L845 550" stroke="#8b9a9a" stroke-width="16" stroke-linecap="round" fill="none"/><circle cx="900" cy="560" r="32" fill="#9a9385"/><text x="470" y="275" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#29463e">FLOATS: apple, dry sponge</text><text x="635" y="650" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#29463e">SINKS: metal spoon, stone</text><text x="65" y="728" font-family="Arial, sans-serif" font-size="27" font-weight="500" fill="#29463e">A sponge can change as it fills with water. Try it and notice.</text></svg>